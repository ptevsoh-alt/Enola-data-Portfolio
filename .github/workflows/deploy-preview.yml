name: Deploy portfolio preview

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch, tag, or commit SHA from ptevsoh-alt/Enola-data"
        required: false
        type: string
        default: "7c554849b3a5b7b6736c01d885497adba407187b"

# GitHub Pages project site is served from the repository-name path:
# https://ptevsoh-alt.github.io/Enola-data-Portfolio/
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-preview-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview deployment configuration
        uses: actions/checkout@v4

      - name: Checkout portfolio source
        uses: actions/checkout@v4
        with:
          repository: ptevsoh-alt/Enola-data
          ref: ${{ inputs.source_ref || '7c554849b3a5b7b6736c01d885497adba407187b' }}
          path: source
          persist-credentials: false

      - name: Checkout PR #32 preview (unmerged source)
        uses: actions/checkout@v4
        with:
          repository: ptevsoh-alt/Enola-data
          ref: 4f920656c4edfa37c8ddc415624e082831d8ec51
          path: preview-source
          persist-credentials: false

      - name: Checkout stacked PR #33 video/IMC/Lifecycle source
        uses: actions/checkout@v4
        with:
          repository: ptevsoh-alt/Enola-data
          ref: 7172e68908025e304c76f589f7f6576dccd20664
          path: video-source
          persist-credentials: false

      - name: Checkout stacked PR #37 M3 Knowledge Loop without KV source
        uses: actions/checkout@v4
        with:
          repository: ptevsoh-alt/Enola-data
          ref: 5213c2a21578186ceba70079fde1175504a07107
          path: learning-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Validate source and public site
        working-directory: source
        run: |
          npm ci
          npm test
          test -f site/index.html
          test -f site/review/index.html
          test -f site/.nojekyll

      - name: Validate PR #32 preview source
        working-directory: preview-source
        run: |
          npm ci
          npm test
          test -f site/index.html
          test -f site/review/index.html
          test -f site/.nojekyll

      - name: Validate PR #33 Video/IMC/Lifecycle source
        working-directory: video-source
        run: |
          npm ci
          npm test
          test -f site/index.html
          test -f site/review/index.html
          test -f site/.nojekyll

      - name: Validate PR #37 Knowledge Loop source and private-asset boundary
        working-directory: learning-source
        run: |
          npm ci
          npm test
          test -f site/index.html
          test -f site/review/index.html
          test -f site/.nojekyll
          test ! -e site/assets/projects/M3_KV_16x9.png
          test ! -e site/assets/projects/M3_KV_4x5.png
          test ! -e site/assets/projects/M3_KV_9x16.png

      - name: Install CJK fonts for accurate Chinese layout validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f

      - name: Render portfolio in real Chrome (desktop/mobile)
        timeout-minutes: 4
        working-directory: source
        run: |
          google-chrome --version || chromium --version
          node scripts/site-visual-audit.cjs

      - name: Render PR #32 standalone preview in real Chrome
        timeout-minutes: 4
        working-directory: preview-source
        run: |
          node scripts/site-visual-audit.cjs > /tmp/pr32-standalone-qa.log 2>&1 || { tail -n 65 /tmp/pr32-standalone-qa.log; exit 1; }
          grep 'VISUAL_QA_RESULT=' /tmp/pr32-standalone-qa.log | tail -n 1

      - name: Render PR #33 video/IMC standalone in Chrome
        timeout-minutes: 4
        working-directory: video-source
        run: |
          node scripts/site-visual-audit.cjs > /tmp/pr33-standalone.log 2>&1 || { tail -n 80 /tmp/pr33-standalone.log; exit 1; }
          grep 'VISUAL_QA_RESULT=' /tmp/pr33-standalone.log | tail -n 1

      - name: Render PR #37 M3 Knowledge Loop standalone in Chrome
        timeout-minutes: 4
        working-directory: learning-source
        run: |
          node scripts/site-visual-audit.cjs > /tmp/pr37-standalone.log 2>&1 || { tail -n 100 /tmp/pr37-standalone.log; exit 1; }
          grep 'VISUAL_QA_RESULT=' /tmp/pr37-standalone.log | tail -n 1

      - name: Assemble isolated preview under /preview/pr32/
        run: |
          mkdir -p public/preview/pr32/
          cp -a source/site/. public/
          cp -a preview-source/site/. public/preview/pr32/
          mkdir -p public/preview/pr33/
          cp -a video-source/site/. public/preview/pr33/
          mkdir -p public/preview/pr37/
          cp -a learning-source/site/. public/preview/pr37/
          python3 - <<'PY'
          from pathlib import Path
          for preview in ['pr32', 'pr33', 'pr37']:
              for rel in ['index.html', 'review/index.html']:
                  p = Path('public/preview') / preview / rel
                  t = p.read_text(encoding='utf-8')
                  needle = '<meta charset="UTF-8" />'
                  if needle not in t:
                      raise SystemExit(f"Preview HTML marker missing: {preview}/{rel}")
                  p.write_text(t.replace(needle, needle+'\n    <meta name="robots" content="noindex,nofollow" />', 1), encoding='utf-8')
          PY
          test -f public/.nojekyll
          test -f public/preview/pr32/.nojekyll
          test -f public/preview/pr32/assets/favicon.svg
          test -f public/preview/pr33/.nojekyll
          test -f public/preview/pr33/assets/favicon.svg
          test -f public/preview/pr33/assets/video/creator-staircase-7s.mp4
          test -f public/preview/pr37/.nojekyll
          test -f public/preview/pr37/assets/projects/m3-yellow-main.webp
          test ! -e public/preview/pr37/assets/projects/M3_KV_16x9.png

      - name: Validate production root and nested PR #32 preview in Chrome
        timeout-minutes: 4
        run: |
          node scripts/verify-nested-preview.cjs
          node preview-source/scripts/site-visual-audit-nested.cjs > /tmp/pr32-nested-qa.log 2>&1 || { tail -n 75 /tmp/pr32-nested-qa.log; exit 1; }
          grep 'VISUAL_QA_RESULT=' /tmp/pr32-nested-qa.log | tail -n 1

      - name: Validate PR #33 nested video preview in real Chrome
        timeout-minutes: 4
        run: |
          node scripts/verify-nested-video-preview.cjs
          node video-source/scripts/site-visual-audit-nested.cjs > /tmp/pr33-nested.log 2>&1 || { tail -n 80 /tmp/pr33-nested.log; exit 1; }
          grep 'VISUAL_QA_RESULT=' /tmp/pr33-nested.log | tail -n 1

      - name: Validate PR #37 M3 learning preview nested route in real Chrome
        timeout-minutes: 4
        run: |
          node scripts/verify-nested-learning-preview.cjs
          node learning-source/scripts/site-visual-audit-nested.cjs > /tmp/pr37-nested.log 2>&1 || { tail -n 100 /tmp/pr37-nested.log; exit 1; }
          grep 'VISUAL_QA_RESULT=' /tmp/pr37-nested.log | tail -n 1

      - name: Archive visual QA metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: source/qa/live-visual-audit.json
          if-no-files-found: warn

      - name: Archive nested PR #32 visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr32-nested-preview-visual-qa
          path: preview-source/qa/live-visual-audit.json
          if-no-files-found: warn

      - name: Archive PR #33 nested preview QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr33-nested-video-qa
          path: video-source/qa/live-visual-audit.json
          if-no-files-found: warn

      - name: Archive PR #37 nested Knowledge Loop visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr37-m3-truth-knowledge-qa
          path: learning-source/qa/live-visual-audit.json
          if-no-files-found: warn

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy isolated portfolio preview
        id: deployment
        uses: actions/deploy-pages@v4
