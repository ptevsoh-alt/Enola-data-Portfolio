name: Deploy portfolio preview

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch, tag, or commit SHA from ptevsoh-alt/Enola-data"
        required: false
        type: string
        default: "7c554849b3a5b7b6736c01d885497adba407187b"

# GitHub Pages project site is served from the repository-name path:
# https://ptevsoh-alt.github.io/Enola-data-Portfolio/
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-preview-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview deployment configuration
        uses: actions/checkout@v4

      - name: Checkout portfolio source
        uses: actions/checkout@v4
        with:
          repository: ptevsoh-alt/Enola-data
          ref: ${{ inputs.source_ref || '7c554849b3a5b7b6736c01d885497adba407187b' }}
          path: source
          persist-credentials: false

      - name: Checkout PR #32 preview (unmerged source)
        uses: actions/checkout@v4
        with:
          repository: ptevsoh-alt/Enola-data
          ref: 4f920656c4edfa37c8ddc415624e082831d8ec51
          path: preview-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Validate source and public site
        working-directory: source
        run: |
          npm ci
          npm test
          test -f site/index.html
          test -f site/review/index.html
          test -f site/.nojekyll

      - name: Validate PR #32 preview source
        working-directory: preview-source
        run: |
          npm ci
          npm test
          test -f site/index.html
          test -f site/review/index.html
          test -f site/.nojekyll

      - name: Install CJK fonts for accurate Chinese layout validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f

      - name: Render portfolio in real Chrome (desktop/mobile)
        timeout-minutes: 4
        working-directory: source
        run: |
          google-chrome --version || chromium --version
          node scripts/site-visual-audit.cjs

      - name: Render PR #32 standalone preview in real Chrome
        timeout-minutes: 4
        working-directory: preview-source
        run: |
          node scripts/site-visual-audit.cjs > /tmp/pr32-standalone-qa.log 2>&1 || { tail -n 65 /tmp/pr32-standalone-qa.log; exit 1; }
          grep 'VISUAL_QA_RESULT=' /tmp/pr32-standalone-qa.log | tail -n 1

      - name: Assemble isolated preview under /preview/pr32/
        run: |
          mkdir -p public/preview/pr32/
          cp -a source/site/. public/
          cp -a preview-source/site/. public/preview/pr32/
          python3 - <<'PY'
          from pathlib import Path
          for rel in ['index.html', 'review/index.html']:
              p = Path('public/preview/pr32') / rel
              t = p.read_text(encoding='utf-8')
              needle = '<meta charset="UTF-8" />'
              if needle not in t:
                  raise SystemExit(f"Preview HTML marker missing: {rel}")
              p.write_text(t.replace(needle, needle+'\n    <meta name="robots" content="noindex,nofollow" />', 1), encoding='utf-8')
          PY
          test -f public/.nojekyll
          test -f public/preview/pr32/.nojekyll
          test -f public/preview/pr32/assets/favicon.svg

      - name: Validate production root and nested PR #32 preview in Chrome
        timeout-minutes: 4
        run: |
          node scripts/verify-nested-preview.cjs
          node preview-source/scripts/site-visual-audit-nested.cjs > /tmp/pr32-nested-qa.log 2>&1 || { tail -n 75 /tmp/pr32-nested-qa.log; exit 1; }
          grep 'VISUAL_QA_RESULT=' /tmp/pr32-nested-qa.log | tail -n 1

      - name: Archive visual QA metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: source/qa/live-visual-audit.json
          if-no-files-found: warn

      - name: Archive nested PR #32 visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr32-nested-preview-visual-qa
          path: preview-source/qa/live-visual-audit.json
          if-no-files-found: warn

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy isolated portfolio preview
        id: deployment
        uses: actions/deploy-pages@v4
