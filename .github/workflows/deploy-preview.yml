name: Deploy portfolio preview

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch, tag, or commit SHA from ptevsoh-alt/Enola-data"
        required: false
        type: string
        default: "9fa365df8378b0fad572471dc00f535b047d5398"

# GitHub Pages project site is served from the repository-name path:
# https://ptevsoh-alt.github.io/Enola-data-Portfolio/
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-preview-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview deployment configuration
        uses: actions/checkout@v4

      - name: Checkout portfolio source
        uses: actions/checkout@v4
        with:
          repository: ptevsoh-alt/Enola-data
          ref: ${{ inputs.source_ref || '9fa365df8378b0fad572471dc00f535b047d5398' }}
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Validate source and public site
        working-directory: source
        run: |
          npm ci
          npm test
          test -f site/index.html
          test -f site/review/index.html
          test -f site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/site/

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy isolated portfolio preview
        id: deployment
        uses: actions/deploy-pages@v4
