name: Deploy full public portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch, tag, or commit SHA from ptevsoh-alt/Enola-data"
        required: false
        type: string
        default: "84fc8f303eaf373d8310df2d89d2f46979313841"

# GitHub Pages project site is served from the repository-name path:
# https://ptevsoh-alt.github.io/Enola-data-Portfolio/
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-preview-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview deployment configuration
        uses: actions/checkout@v4

      - name: Checkout portfolio source
        uses: actions/checkout@v4
        with:
          repository: ptevsoh-alt/Enola-data
          ref: ${{ inputs.source_ref || '84fc8f303eaf373d8310df2d89d2f46979313841' }}
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Validate final merged source and public site
        working-directory: source
        run: |
          npm ci
          npm test
          test -f site/index.html
          test -f site/review/index.html
          test -f site/.nojekyll

      - name: Install CJK fonts for accurate Chinese layout validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f

      - name: Render official portfolio in real Chrome (desktop/mobile)
        timeout-minutes: 4
        working-directory: source
        run: |
          google-chrome --version || chromium --version
          node scripts/site-visual-audit.cjs

      - name: Assemble sanitized public root and retired-preview redirects
        run: |
          mkdir -p public
          cp -a source/site/. public/
          python3 - <<'PY'
          from pathlib import Path
          for slug in ('pr32', 'pr33', 'pr37'):
              folder = Path('public/preview') / slug
              folder.mkdir(parents=True, exist_ok=True)
              (folder / 'index.html').write_text(
                  '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">'
                  '<meta name="robots" content="noindex,nofollow">'
                  '<meta http-equiv="refresh" content="0;url=../../">'
                  '<title>请查看最新版作品集</title></head><body>'
                  '<p>历史预览已归档，请访问<a href="../../">最新作品集</a>。</p>'
                  '</body></html>\n', encoding='utf-8')
          PY
          test -f public/.nojekyll
          test -f public/review/index.html
          test -f public/assets/video/creator-staircase-7s.mp4
          test -f public/assets/video/creator-livingroom-7s.mp4
          test ! -e public/preview/pr32/projects.js
          test ! -e public/preview/pr33/projects.js
          test ! -e public/preview/pr37/projects.js

      - name: Archive visual QA metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: source/qa/live-visual-audit.json
          if-no-files-found: warn

      - name: Gate final production root content before release
        run: |
          node scripts/verify-public-root-release.cjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy sanitized portfolio root with video cases
        id: deployment
        uses: actions/deploy-pages@v4
