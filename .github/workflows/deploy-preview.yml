name: Deploy portfolio preview

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch, tag, or commit SHA from ptevsoh-alt/Enola-data"
        required: false
        type: string
        default: "0ee43babb04a8a3ea1d500d07f1210588a5e5707"

# GitHub Pages project site is served from the repository-name path:
# https://ptevsoh-alt.github.io/Enola-data-Portfolio/
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-preview-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview deployment configuration
        uses: actions/checkout@v4

      - name: Checkout portfolio source
        uses: actions/checkout@v4
        with:
          repository: ptevsoh-alt/Enola-data
          ref: ${{ inputs.source_ref || '0ee43babb04a8a3ea1d500d07f1210588a5e5707' }}
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Validate source and public site
        working-directory: source
        run: |
          npm ci
          npm test
          test -f site/index.html
          test -f site/review/index.html
          test -f site/.nojekyll

      - name: Install CJK fonts for accurate Chinese layout validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f

      - name: Render portfolio in real Chrome (desktop/mobile)
        timeout-minutes: 4
        working-directory: source
        run: |
          google-chrome --version || chromium --version
          node scripts/site-visual-audit.cjs

      - name: Archive visual QA metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: source/qa/live-visual-audit.json
          if-no-files-found: warn

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/site/

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy isolated portfolio preview
        id: deployment
        uses: actions/deploy-pages@v4
