name: Validate portfolio review
on:
  pull_request:
    paths:
      - portfolio.patch
      - .github/workflows/review-portfolio.yml
      - .github/workflows/deploy-preview.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ptevsoh-alt/Enola-data
          ref: aa43194e6b125a8d6dab66a62ef73afca4a95ad9
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Apply and test portfolio
        working-directory: source
        run: |
          git apply --check ../portfolio.patch
          git apply ../portfolio.patch
          npm ci
          npm test
      - name: Package review website
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-review-site
          path: source/site/
          include-hidden-files: true
          if-no-files-found: error
